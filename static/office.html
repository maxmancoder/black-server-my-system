<!DOCTYPE html>
<html lang="fa" dir="ltr">
<head>
<meta charset="utf-8">
<script>try{var t=localStorage.getItem('bs-theme');var TH=['dark','light','blue','purple','orange','green','sunset'];if(TH.indexOf(t)>=0)document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__NAME__ - Black Server</title>
<link rel="icon" href="/favicon.ico" sizes="8681">
<style>
:root{
  --bg:#070b14;--panel:#0e1628;--panel2:#111c33;--panel3:#152240;
  --border:#1c2d4f;--border2:#243b66;--text:#e8eefc;--text2:#8ba0c5;--text3:#5a719e;
  --blue:#3b82f6;--blue2:#2563eb;--green:#22c55e;--red:#ef4444;
  --hover:rgba(255,255,255,.06);--sel:rgba(59,130,246,.16);
  --paper:#ffffff;--paper-text:#16213e;--stage:#0b1120;
  --grid-line:#22335a;--grid-head:#101a30;--grid-alt:rgba(255,255,255,.02);
}
html[data-theme=light]{
  --bg:#f3f5f9;--panel:#ffffff;--panel2:#eef1f6;--panel3:#e3e8f0;
  --border:#d9dee8;--border2:#c8d0de;--text:#111827;--text2:#4b5563;--text3:#6b7280;
  --hover:rgba(0,0,0,.05);--sel:rgba(59,130,246,.14);
  --paper:#ffffff;--paper-text:#16213e;--stage:#e9edf4;
  --grid-line:#d5dbe6;--grid-head:#f1f4f9;--grid-alt:rgba(0,0,0,.025);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  display:flex;flex-direction:column;overflow:hidden;
  background:var(--bg);color:var(--text);
  font-family:'Segoe UI',system-ui,-apple-system,'Noto Sans Arabic',sans-serif;
}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select{font-family:inherit}

/* ---------- header ---------- */
.ohead{
  flex:0 0 auto;display:flex;align-items:center;gap:10px;
  padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--border);
}
.hbtn{
  display:inline-flex;align-items:center;gap:7px;padding:7px 13px;border-radius:9px;
  border:1px solid var(--border2);background:var(--panel2);color:var(--text2);
  font-size:12.5px;font-weight:700;transition:all .15s;white-space:nowrap;
}
.hbtn:hover{border-color:var(--blue);color:var(--text)}
.hbtn.primary{background:linear-gradient(135deg,var(--blue),var(--blue2));border-color:transparent;color:#fff}
.hbtn.primary:hover{filter:brightness(1.08)}
.hbtn.primary.saved{background:linear-gradient(135deg,#22c55e,#16a34a)}
.hname{
  font-weight:800;font-size:13.5px;direction:ltr;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.hsize{color:var(--text3);font-size:11.5px;white-space:nowrap}
.hstat{font-size:12px;color:var(--text3);white-space:nowrap}
.hstat.ok{color:var(--green)}
.hstat.err{color:var(--red)}
.spacer{flex:1}

/* ---------- toolbar ---------- */
.otools{
  flex:0 0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:6px;
  padding:7px 10px;background:var(--panel2);border-bottom:1px solid var(--border);
}
.tgrp{display:flex;align-items:center;gap:3px;padding:0 6px;border-right:1px solid var(--border)}
.tgrp:last-child{border-right:none}
.tb{
  min-width:30px;height:29px;padding:0 7px;border-radius:7px;border:1px solid transparent;
  display:inline-flex;align-items:center;justify-content:center;gap:5px;
  color:var(--text2);font-size:13px;font-weight:700;transition:all .12s;
}
.tb:hover{background:var(--panel3);color:var(--text)}
.tb.on{background:var(--sel);border-color:rgba(59,130,246,.5);color:var(--blue)}
.tb[disabled]{opacity:.35;pointer-events:none}
.tb input[type=color]{
  width:22px;height:22px;padding:0;border:none;border-radius:6px;cursor:pointer;background:none;
}
.tb.color{gap:0;padding:0 4px}
.tsel{
  height:29px;border-radius:7px;border:1px solid var(--border2);background:var(--panel);
  color:var(--text);font-size:12px;padding:0 6px;outline:none;max-width:140px;
}
.tsel:focus{border-color:var(--blue)}
.tsel.narrow{max-width:74px}
body.k-word .t-sheet, body.k-word .t-slide,
body.k-sheet .t-word, body.k-sheet .t-slide,
body.k-slide .t-word, body.k-slide .t-sheet{display:none}

/* ---------- main ---------- */
.omain{flex:1 1 auto;min-height:0;display:flex;position:relative}
/* word */
#wordArea{flex:1;min-width:0;overflow:auto;padding:22px 14px 70px;display:flex;justify-content:center;background:var(--stage)}
#wordDoc{
  width:min(820px,100%);min-height:calc(100vh - 210px);background:var(--paper);color:var(--paper-text);
  border-radius:4px;box-shadow:0 12px 44px rgba(0,0,0,.45);
  padding:52px 58px;outline:none;font-family:Calibri,'Segoe UI',Arial,sans-serif;
  font-size:15px;line-height:1.62;direction:ltr;text-align:left;
}
#wordDoc:focus{box-shadow:0 12px 44px rgba(0,0,0,.45),0 0 0 2px rgba(59,130,246,.5)}
#wordDoc p,#wordDoc div{margin:0 0 8px}
#wordDoc h1{font-size:26px;margin:14px 0 8px}
#wordDoc h2{font-size:21px;margin:12px 0 7px}
#wordDoc h3{font-size:17.5px;margin:10px 0 6px}
#wordDoc h4,#wordDoc h5,#wordDoc h6{font-size:15.5px;margin:9px 0 5px}
#wordDoc blockquote{border-left:3px solid var(--blue);padding-left:12px;color:#475569;margin:8px 0}
#wordDoc pre{background:#f1f5f9;border-radius:6px;padding:10px 12px;font-family:Consolas,monospace;font-size:13px;white-space:pre-wrap}
#wordDoc ul,#wordDoc ol{margin:4px 0 8px 26px}
#wordDoc li{margin:2px 0}
#wordDoc hr{border:none;border-top:1px solid #cbd5e1;margin:14px 0}
#wordDoc table{border-collapse:collapse;margin:8px 0;width:100%}
#wordDoc td,#wordDoc th{border:1px solid #94a3b8;padding:5px 8px;min-width:40px}
#wordDoc img{max-width:100%;height:auto}
#wordDoc a{color:#2563eb}
@media (max-width:700px){
  #wordDoc{padding:24px 16px;border-radius:0;min-height:calc(100vh - 170px);font-size:14.5px}
}
/* sheet */
#sheetArea{flex:1;min-width:0;display:flex;flex-direction:column}
.fbar{
  flex:0 0 auto;display:flex;align-items:center;gap:8px;
  padding:5px 10px;background:var(--panel);border-bottom:1px solid var(--border);
}
.fxb{
  min-width:56px;text-align:center;font-size:12px;font-weight:800;color:var(--text2);
  background:var(--panel2);border:1px solid var(--border2);border-radius:7px;padding:5px 8px;
  direction:ltr;
}
#fxInput{
  flex:1;min-width:0;background:var(--panel2);border:1px solid var(--border2);border-radius:7px;
  color:var(--text);font-size:12.5px;padding:6px 9px;outline:none;font-family:Consolas,monospace;
  direction:ltr;text-align:left;
}
#fxInput:focus{border-color:var(--blue)}
.gridwrap{flex:1 1 auto;min-height:0;overflow:auto;position:relative;background:var(--bg)}
table.grid{border-collapse:separate;border-spacing:0;table-layout:fixed;background:var(--bg)}
.grid th,.grid td{
  border-right:1px solid var(--grid-line);border-bottom:1px solid var(--grid-line);
  font-size:12.5px;height:26px;padding:0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.grid th{
  position:sticky;z-index:3;background:var(--grid-head);color:var(--text3);
  font-weight:700;font-size:11px;user-select:none;text-align:center;
}
.grid th.rh{left:0;z-index:4;width:42px;min-width:42px}
.grid th.ch{top:0}
.grid th.corner{top:0;left:0;z-index:5}
.grid th.lit{color:var(--blue);background:var(--panel3)}
.grid td{
  background:var(--bg);color:var(--text);cursor:cell;position:relative;min-width:84px;
  direction:ltr;text-align:left;
}
.grid td.alt{background:var(--grid-alt)}
.grid td.sel{background:var(--sel)}
.grid td.cur{outline:2px solid var(--blue);outline-offset:-2px;z-index:2}
.grid td.editing{overflow:visible;z-index:6}
.grid td .cellin{
  position:absolute;inset:0;width:100%;height:100%;border:2px solid var(--blue);
  background:var(--panel);color:var(--text);font:inherit;padding:0 5px;outline:none;z-index:7;
}
.grid td.num{text-align:right}
.grid td.err{color:var(--red)}
.stabs{
  flex:0 0 auto;display:flex;align-items:center;gap:4px;padding:5px 8px;
  background:var(--panel2);border-top:1px solid var(--border);overflow-x:auto;
}
.stab{
  display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:8px;
  border:1px solid transparent;color:var(--text3);font-size:12px;font-weight:700;
  white-space:nowrap;transition:all .12s;
}
.stab:hover{background:var(--panel3);color:var(--text2)}
.stab.on{background:var(--sel);border-color:rgba(59,130,246,.45);color:var(--blue)}
.stab .x{opacity:.55;font-size:11px}
.stab .x:hover{opacity:1;color:var(--red)}
.stab-add{padding:5px 11px;border-radius:8px;color:var(--text3);font-size:14px;font-weight:800}
.stab-add:hover{background:var(--panel3);color:var(--text)}
/* slide */
#slideArea{flex:1;min-width:0;display:flex;min-height:0}
.sthumbs{
  flex:0 0 auto;width:148px;overflow-y:auto;padding:10px 8px;display:flex;flex-direction:column;gap:9px;
  background:var(--panel);border-right:1px solid var(--border);
}
.sthumb{
  position:relative;width:100%;aspect-ratio:16/9;border:2px solid var(--border2);border-radius:7px;
  background:#fff;cursor:pointer;overflow:hidden;flex:0 0 auto;transition:border-color .15s;
}
.sthumb:hover{border-color:var(--text3)}
.sthumb.on{border-color:var(--blue);box-shadow:0 0 0 3px rgba(59,130,246,.25)}
.sthumb .n{
  position:absolute;top:3px;left:4px;z-index:2;font-size:9.5px;font-weight:800;
  background:rgba(15,23,42,.72);color:#fff;border-radius:4px;padding:0 5px;
}
.sthumb .mini{
  position:absolute;inset:0;padding:6% 7%;overflow:hidden;color:#111;
  font-size:4.2px;line-height:1.35;direction:ltr;text-align:left;word-break:break-word;
}
.sthumb .mini .mt{font-weight:800;font-size:5.4px;margin-bottom:2px}
.sstage{flex:1;min-width:0;overflow:auto;display:flex;align-items:flex-start;justify-content:center;padding:18px}
.scanvas{
  position:relative;width:min(880px,100%);aspect-ratio:16/9;flex:0 0 auto;
  background:#fff;color:#16213e;box-shadow:0 14px 46px rgba(0,0,0,.5);overflow:hidden;
}
.sblk{
  position:absolute;padding:3px 6px;outline:none;font-family:Calibri,'Segoe UI',Arial,sans-serif;
  line-height:1.3;overflow:hidden;white-space:pre-wrap;word-break:break-word;cursor:text;min-height:1em;
}
.sblk:focus{outline:2px solid rgba(59,130,246,.8);background:rgba(59,130,246,.07)}
.sblk p{margin:0 0 2px}
.simg{position:absolute;object-fit:contain;pointer-events:none}
@media (max-width:760px){
  #slideArea{flex-direction:column}
  .sthumbs{width:auto;flex-direction:row;border-right:none;border-bottom:1px solid var(--border);order:2;overflow-x:auto;overflow-y:hidden}
  .sthumb{width:92px;flex:0 0 auto}
  .sstage{order:1;padding:10px}
}
/* footer */
.ofoot{
  flex:0 0 auto;display:flex;align-items:center;gap:16px;padding:5px 12px;
  background:var(--panel);border-top:1px solid var(--border);
  font-size:11.5px;color:var(--text3);
}
/* notice (unsupported format) */
.notice{
  position:absolute;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;
  background:color-mix(in srgb,var(--bg) 82%, transparent);backdrop-filter:blur(3px);padding:20px;
}
.notice[hidden]{display:none}
.ncard{
  width:min(430px,100%);background:var(--panel);border:1px solid var(--border);border-radius:20px;
  padding:30px 24px;text-align:center;box-shadow:0 24px 60px rgba(0,0,0,.5);
}
.ncard .ni{font-size:38px;margin-bottom:10px}
.ncard h2{font-size:16.5px;font-weight:800}
.ncard p{margin-top:10px;font-size:13px;color:var(--text3);line-height:1.9}
.nbtns{display:flex;gap:10px;margin-top:20px}
.nbtns .hbtn{flex:1;justify-content:center;padding:11px 12px;font-size:13.5px}
/* present mode */
.present{position:fixed;inset:0;z-index:80;background:#000;display:flex;align-items:center;justify-content:center}
.present[hidden]{display:none}
.pslide{position:relative;width:100vw;height:100vh;display:flex;align-items:center;justify-content:center}
.pinner{position:relative;background:#fff;box-shadow:0 0 60px rgba(0,0,0,.8);overflow:hidden}
.pnav{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:81}
.pnav button{
  padding:8px 16px;border-radius:9px;background:rgba(255,255,255,.12);color:#fff;
  font-size:13px;font-weight:700;border:1px solid rgba(255,255,255,.2);
}
.pnav button:hover{background:rgba(255,255,255,.22)}
.pcount{position:fixed;top:14px;right:16px;color:rgba(255,255,255,.75);font-size:12.5px;font-weight:700;z-index:81}
</style>
</head>
<body class="k-word">

<header class="ohead">
  <button class="hbtn" type="button" id="backBtn">&#8592; بازگشت</button>
  <span class="hname" dir="ltr">__NAME__</span>
  <span class="hsize">__SIZE__</span>
  <span class="hstat" id="hstat"></span>
  <span class="spacer"></span>
  <a class="hbtn" id="dlBtn" href="__DL__">&#8681; دانلود</a>
  <button class="hbtn primary" type="button" id="saveBtn">ذخیره</button>
</header>

<div class="otools">
  <div class="tgrp">
    <button class="tb" type="button" data-cmd="undo" title="بازگردانی (Ctrl+Z)">&#8630;</button>
    <button class="tb" type="button" data-cmd="redo" title="انجام مجدد (Ctrl+Y)">&#8631;</button>
  </div>

  <div class="tgrp t-word t-sheet t-slide">
    <select class="tsel" id="ffSel" title="فونت"></select>
    <select class="tsel narrow" id="fsSel" title="اندازه فونت"></select>
  </div>

  <div class="tgrp t-word t-sheet t-slide">
    <button class="tb" type="button" data-cmd="bold" title="بولد (Ctrl+B)"><b>B</b></button>
    <button class="tb" type="button" data-cmd="italic" title="ایتالیک (Ctrl+I)"><i>I</i></button>
    <button class="tb" type="button" data-cmd="underline" title="زیرخط (Ctrl+U)"><u>U</u></button>
    <button class="tb" type="button" data-cmd="strike" title="خط‌خورده"><s>S</s></button>
  </div>

  <div class="tgrp t-word t-sheet t-slide">
    <label class="tb color" title="رنگ متن"><input type="color" id="fgCol" value="#e11d48"><span>A</span></label>
    <label class="tb color" id="bgWrap" title="رنگ پس‌زمینه"><input type="color" id="bgCol" value="#fde047"><span>&#9632;</span></label>
  </div>

  <div class="tgrp t-word t-sheet t-slide">
    <button class="tb" type="button" data-align="left" title="چپ‌چین">&#8676;</button>
    <button class="tb" type="button" data-align="center" title="وسط‌چین">&#8596;</button>
    <button class="tb" type="button" data-align="right" title="راست‌چین">&#8677;</button>
    <button class="tb t-word" type="button" data-align="justify" title="هم‌عرض">&#9776;</button>
  </div>

  <!-- word only -->
  <div class="tgrp t-word">
    <select class="tsel narrow" id="blkSel" title="نوع بند">
      <option value="p">متن</option>
      <option value="h1">عنوان ۱</option>
      <option value="h2">عنوان ۲</option>
      <option value="h3">عنوان ۳</option>
      <option value="blockquote">نقل‌قول</option>
      <option value="pre">کد</option>
    </select>
  </div>
  <div class="tgrp t-word">
    <button class="tb" type="button" data-cmd="insertUnorderedList" title="لیست تیره">&#8226; —</button>
    <button class="tb" type="button" data-cmd="insertOrderedList" title="لیست شماره‌دار">۱. —</button>
    <button class="tb" type="button" data-cmd="outdent" title="بازکردن تورفتگی">&#8676;|</button>
    <button class="tb" type="button" data-cmd="indent" title="تورفتگی">|&#8677;</button>
  </div>
  <div class="tgrp t-word">
    <button class="tb" type="button" id="wLink" title="پیوند">&#128279;</button>
    <button class="tb" type="button" id="wImg" title="درج تصویر">&#128444;</button>
    <button class="tb" type="button" id="wTable" title="جدول">&#9638;</button>
    <button class="tb" type="button" id="wHr" title="خط جداکننده">&#8212;</button>
    <button class="tb" type="button" data-cmd="removeFormat" title="حذف قالب">&#10697;</button>
  </div>

  <!-- sheet only -->
  <div class="tgrp t-sheet">
    <select class="tsel" id="fmtSel" title="قالب عدد">
      <option value="">عمومی</option>
      <option value="0">0</option>
      <option value="0.00">0.00</option>
      <option value="#,##0">#,##0</option>
      <option value="#,##0.00">#,##0.00</option>
      <option value="0%">0%</option>
      <option value="0.00%">0.00%</option>
      <option value="$#,##0.00">$#,##0.00</option>
      <option value="yyyy-mm-dd">تاریخ</option>
      <option value="hh:mm">ساعت</option>
      <option value="@">متن</option>
    </select>
    <button class="tb" type="button" id="shAddRow" title="افزودن ردیف">+ردیف</button>
    <button class="tb" type="button" id="shDelRow" title="حذف ردیف">−ردیف</button>
    <button class="tb" type="button" id="shAddCol" title="افزودن ستون">+ستون</button>
    <button class="tb" type="button" id="shDelCol" title="حذف ستون">−ستون</button>
  </div>

  <!-- slide only -->
  <div class="tgrp t-slide">
    <button class="tb" type="button" id="sAdd" title="اسلاید جدید">+اسلاید</button>
    <button class="tb" type="button" id="sDup" title="تکرار اسلاید">&#10697;</button>
    <button class="tb" type="button" id="sDel" title="حذف اسلاید">&#128465;</button>
    <button class="tb" type="button" id="sPrev" title="قبلی">&#8249;</button>
    <button class="tb" type="button" id="sNext" title="بعدی">&#8250;</button>
    <label class="tb color" title="رنگ پس‌زمینه اسلاید"><input type="color" id="sBg" value="#ffffff"><span>&#9632;</span></label>
    <button class="tb" type="button" id="sText" title="جعبه متن">&#+متن</button>
    <button class="tb" type="button" id="sPresent" title="نمایش">&#9654;</button>
  </div>
</div>

<main class="omain">
  <div id="wordArea">
    <div id="wordDoc" contenteditable="true" spellcheck="false"></div>
  </div>

  <div id="sheetArea" hidden>
    <div class="fbar">
      <span class="fxb" id="cellRef">A1</span>
      <input id="fxInput" autocomplete="off" spellcheck="false" placeholder="مقدار یا فرمول (=SUM(A1:A5))">
    </div>
    <div class="gridwrap" id="gridWrap"></div>
    <div class="stabs" id="stabs"></div>
  </div>

  <div id="slideArea" hidden>
    <div class="sthumbs" id="sthumbs"></div>
    <div class="sstage" id="sstage"><div class="scanvas" id="scanvas"></div></div>
  </div>

  <div class="notice" id="notice" hidden>
    <div class="ncard">
      <div class="ni">&#128196;</div>
      <h2 id="noticeTitle">این فرمت در مرورگر ویرایش نمی‌شود</h2>
      <p id="noticeText"></p>
      <div class="nbtns">
        <a class="hbtn primary" id="noticeDl" href="__DL__">&#8681; دانلود فایل</a>
        <button class="hbtn" type="button" id="noticeBack">بازگشت</button>
      </div>
    </div>
  </div>
</main>

<footer class="ofoot">
  <span id="footKind"></span>
  <span id="footInfo"></span>
  <span class="spacer"></span>
  <span id="footHint"></span>
</footer>

<div class="present" id="present" hidden>
  <div class="pslide" id="pslide"><div class="pinner" id="pinner"></div></div>
  <div class="pcount" id="pcount"></div>
  <div class="pnav">
    <button type="button" id="pPrev">&#8249; قبلی</button>
    <button type="button" id="pNext">بعدی &#8250;</button>
    <button type="button" id="pExit">خروج (Esc)</button>
  </div>
</div>

<input type="file" id="imgInput" accept="image/*" hidden>

<script>
"use strict";
/* =====================================================================
   Office-style editor: one page, three modes.
     word  -> rich text (docx via mammoth, rtf/odt parsed here)
     sheet -> spreadsheet grid with formulas (xlsx via SheetJS)
     slide -> presentation editor (pptx via JSZip)
   ===================================================================== */
var KIND = "__KIND__";
var EXT  = "__EXT__".toLowerCase();
var NAME = __JSON_NAME__;
var SRC  = "__SRC__";
var $  = function(id){ return document.getElementById(id); };
var BYTE_URL = SRC + (SRC.indexOf("?") >= 0 ? "&" : "?") + "proxy=1";

function setStatus(msg, cls){

function imageToDocx(img, ctx){

function runsToDocx(runs, ctx, mono){
  var xml = "", openLink = null;
  function closeLink(){ if (openLink){ xml += "</w:hyperlink>"; openLink = null; } }
  for (var i = 0; i < runs.length; i++){
    var r = runs[i];
    if (r.br){ closeLink(); xml += "<w:r>" + (ctx.lastRpr || "") + "<w:br/></w:r>"; continue; }
    if (r.img){ closeLink(); xml += imageToDocx(r.img, ctx); continue; }
    var rr = {t: r.t, b: r.b, i: r.i, u: r.u, strike: r.strike, color: r.color,
              font: mono || r.font, sz: r.sz, hl: r.hl, sub: r.sub, sup: r.sup};
    var rpr = "";
    if (rr.font) rpr += '<w:rFonts w:ascii="' + esc(rr.font) + '" w:hAnsi="' + esc(rr.font) +
                        '" w:cs="' + esc(rr.font) + '"/>';
    if (rr.b) rpr += "<w:b/>";
    if (rr.i) rpr += "<w:i/>";
    if (rr.u) rpr += '<w:u w:val="single"/>';
    if (rr.strike) rpr += "<w:strike/>";
    if (rr.sub) rpr += '<w:vertAlign w:val="subscript"/>';
    if (rr.sup) rpr += '<w:vertAlign w:val="superscript"/>';
    if (rr.color) rpr += '<w:color w:val="' + rr.color + '"/>';
    if (rr.hl) rpr += '<w:shd w:val="clear" w:color="auto" w:fill="' + rr.hl + '"/>';
    if (rr.sz) rpr += '<w:sz w:val="' + (rr.sz * 2) + '"/><w:szCs w:val="' + (rr.sz * 2) + '"/>';
    ctx.lastRpr = rpr ? "<w:rPr>" + rpr + "</w:rPr>" : "";

      openLink = r.href;
    }
    xml += "<w:r>" + ctx.lastRpr + '<w:t xml:space="preserve">' + esc(r.t) + "</w:t></w:r>";

  closeLink();

}
function blockToDocx(b, ctx){

           "</w:pBdr></w:pPr></w:p>";

    ["top", "left", "bottom", "right", "insideH", "insideV"].forEach(function(s){
      xml += "<w:" + s + ' w:val=\"single\" w:sz=\"4\" w:space=\"0\" w:color=\"808080\"/>';
    });
    xml += "</w:tblBorders></w:tblPr><w:tblGrid>";
    for (var g = 0; g < cols; g++) xml += '<w:gridCol w:w="1980"/>';
    xml += "</w:tblGrid>";

               runsToDocx(rows[r][c], ctx, null) + "</w:p></w:tc>";
      }

  }
  var ppr = "<w:pPr>";
  if (b.kind === "h") ppr += '<w:spacing w:before="180" w:after="90"/>';
  else if (b.kind === "pre") ppr += '<w:spacing w:after="60" w:line="240" w:lineRule="auto"/>';
  else ppr += '<w:spacing w:after="120"/>';
  if (b.kind === "quote") ppr += '<w:ind w:left="720"/>';
  if (b.list) ppr += '<w:numPr><w:ilvl w:val="' + (b.level || 0) + '"/>' +
                     '<w:numId w:val="' + (b.list === "ol" ? 2 : 1) + '"/></w:numPr>';

function buildDocxFromBlocks(blocks){
  var ctx = {media: [], rels: [], links: [], lastRpr: ""};

      '<Default Extension="bmp" ContentType="image/bmp"/>' +
      '<Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>' +
      '<Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/>' +
      '<Override PartName="/word/numbering.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.numbering+xml"/>' +
      "</Types>";
    files["_rels/.rels"] =
      '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<Relationships xmlns="' + REL_NS + '">' +
      '<Relationship Id="rId1" Type="' + REL_TYPE_NS + '/officeDocument" Target="word/document.xml"/>' +
      "</Relationships>";
    var docRels =
      '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<Relationships xmlns="' + REL_NS + '">' +
      '<Relationship Id="rId1" Type="' + REL_TYPE_NS + '/styles" Target="styles.xml"/>' +
      '<Relationship Id="rId2" Type="' + REL_TYPE_NS + '/numbering" Target="numbering.xml"/>' +
      ctx.rels.join("") +
      "</Relationships>";
    ctx.links.forEach(function(l, i){
      docRels = docRels.replace("</Relationships>",
        '<Relationship Id="' + l.rid + '" Type="' + REL_TYPE_NS + '/hyperlink" Target="' +

      "<w:body>" + body + "</w:body></w:document>";

/* ---- rtf writer (keeps .rtf files in their own format) ---- */
function rtfEscape(s){
  var out = "";
  for (var i = 0; i < s.length; i++){
    var c = s.charCodeAt(i);
    var ch = s.charAt(i);
    if (ch === "\\" || ch === "{" || ch === "}") out += "\\" + ch;
    else if (c === 10) out += "\\line ";
    else if (c < 128) out += ch;
    else out += "\\u" + (c > 32767 ? c - 65536 : c) + "?";
  }
  return out;
}
function runsToRtf(runs){
  var out = "";
  for (var i = 0; i < runs.length; i++){
    var r = runs[i];
    if (r.br){ out += "\\line "; continue; }
    if (r.img) continue;
    if (r.b) out += "\\b ";
    if (r.i) out += "\\i ";
    if (r.u) out += "\\ul ";
    if (r.strike) out += "\\strike ";
    if (r.sz) out += "\\fs" + (r.sz * 2) + " ";
    out += rtfEscape(r.t);
    if (r.b) out += "\\b0 ";
    if (r.i) out += "\\i0 ";
    if (r.u) out += "\\ul0 ";
    if (r.strike) out += "\\strike0 ";
  }
  return out;
}
function buildRtfFromBlocks(blocks){
  var body = "";
  blocks.forEach(function(b){
    if (b.hr){ body += "\\pard\\brdrb\\brdrs\\brdrw10\\brsp4 \\par\n"; return; }
    if (b.kind === "table"){
      b.rows.forEach(function(row){
        body += "\\pard " + row.map(function(cell){ return runsToRtf(cell); }).join(" \\tab ") + " \\par\n";
      });
      return;
    }
    var align = b.align === "center" ? "\\qc " : b.align === "right" ? "\\qr " :
                b.align === "justify" ? "\\qj " : "\\ql ";
    var indent = b.kind === "quote" ? "\\li720 " : "";
    var prefix = b.list === "ul" ? "\\bullet\\tab " : b.list === "ol" ? "\\tab " : "";
    var head = b.kind === "h" ? "\\b\\fs" + (b.tagLevel === 1 ? 52 : b.tagLevel === 2 ? 40 : 32) + " " : "";
    body += "\\pard" + align + indent + prefix + head + runsToRtf(b.runs) +
            (b.kind === "h" ? "\\b0\\fs22 " : "") + "\\par\n";
  });
  return "{\\rtf1\\ansi\\deff0" +
    "{\\fonttbl{\\f0\\fnil\\fcharset0 Calibri;}{\\f1\\fnil\\fcharset0 Arial;}}" +
    "\\f0\\fs22 " + body + "}";
}

var savedRange = null;
function saveSel(){
  var s = window.getSelection();
  if (s && s.rangeCount) savedRange = s.getRangeAt(0).cloneRange();
}
function restoreSel(){
  if (!savedRange) return false;
  var s = window.getSelection();
  s.removeAllRanges();
  s.addRange(savedRange);
  return true;
}
function exec(cmd, val){
  try { document.execCommand("styleWithCSS", false, null); } catch(e){}
  try { document.execCommand(cmd, false, val == null ? null : val); } catch(e){}
  if (KIND === "slide") markSlideDirty();
}
function execCss(cmd, val){
  try { document.execCommand("styleWithCSS", false, "true"); } catch(e){}
  try { document.execCommand(cmd, false, val); } catch(e){}
  if (KIND === "slide") markSlideDirty();
}
function wordSetSize(pt){
  restoreSel();
  try { document.execCommand("styleWithCSS", false, "false"); } catch(e){}
  try { document.execCommand("fontSize", false, "7"); } catch(e){}
  var fonts = wordDoc.querySelectorAll('font[size="7"]');
  for (var i = 0; i < fonts.length; i++){
    var f = fonts[i], sp = document.createElement("span");
    sp.style.fontSize = Math.round(pt * 96 / 72) + "px";
    while (f.firstChild) sp.appendChild(f.firstChild);
    if (f.style && f.style.cssText) sp.setAttribute("style", (sp.getAttribute("style") || "") + ";" + f.style.cssText);
    f.parentNode.replaceChild(sp, f);
  }
}
function syncToolbar(){
  if (KIND === "sheet"){ syncSheetToolbar(); return; }
  if (KIND === "slide"){ syncSlideToolbar(); return; }
  if (KIND !== "word") return;
  var sel = window.getSelection();
  if (!sel || !sel.rangeCount) return;
  if (!wordDoc.contains(sel.anchorNode)) return;
  [["bold","bold"],["italic","italic"],["underline","underline"],["strike","strike"]].forEach(function(p){
    var b = document.querySelector('.tb[data-cmd="' + p[0] + '"]');
    if (!b) return;
    var on = false;
    try { on = document.queryCommandState(p[1]); } catch(e){}
    b.classList.toggle("on", !!on);
  });
  var node = sel.anchorNode;
  var el = node && node.nodeType === 3 ? node.parentNode : node;
  if (!el || !el.style) return;
  try {
    var cs = window.getComputedStyle(el);
    var fam = String(cs.fontFamily || "").split(",")[0].replace(/["']/g, "").trim();
    if (fam && FONTS.indexOf(fam) >= 0) $("ffSel").value = fam;
    var px = Math.round((parseFloat(cs.fontSize) || 16) * 0.75);
    if (SIZES.indexOf(px) >= 0) $("fsSel").value = String(px);
  } catch(e){}
}

function zipFiles(files, mime){

function colName(c){
  var s = "";
  c = c | 0;
  do { s = String.fromCharCode(65 + (c % 26)) + s; c = Math.floor(c / 26) - 1; } while (c >= 0);
  return s;
}
function colIndex(name){
  var c = 0;
  name = String(name).toUpperCase();
  for (var i = 0; i < name.length; i++){
    var k = name.charCodeAt(i) - 64;
    if (k < 1 || k > 26) return -1;
    c = c * 26 + k;
  }
  return c - 1;
}
function addrOf(r, c){ return colName(c) + (r + 1); }
function parseAddr(a){
  var m = /^\$?([A-Za-z]{1,3})\$?(\d{1,7})$/.exec(String(a));
  if (!m) return null;
  var c = colIndex(m[1]);
  var r = parseInt(m[2], 10) - 1;
  if (c < 0 || r < 0) return null;
  return {r: r, c: c};
}
function dateToSerial(ms){
  return ms / 86400000 + 25569;
}
function serialToDate(serial){
  return new Date(Math.round((serial - 25569) * 86400000));
}
function two(n){ return (n < 10 ? "0" : "") + n; }
function fmtGeneral(v){
  if (typeof v !== "number") return String(v == null ? "" : v);
  if (!isFinite(v)) return "#NUM!";
  if (v === Math.floor(v) && Math.abs(v) < 1e15) return String(v);
  var s = String(v);
  if (s.length > 16) s = v.toPrecision(10).replace(/0+$/, "").replace(/\.$/, "");
  return s;
}
function group3(s){
  var out = "", cnt = 0;
  for (var i = s.length - 1; i >= 0; i--){
    out = s.charAt(i) + out;
    cnt++;
    if (cnt % 3 === 0 && i > 0) out = "," + out;
  }

}
function formatDate(v, fmt){
  var d = (v instanceof Date) ? v : serialToDate(v);
  if (isNaN(d.getTime())) return "#VALUE!";
  var f = String(fmt || "yyyy-mm-dd");
  var MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  return f.replace(/yyyy|yy|mmm|mm|m|dd|d|hh|h|ss|AM\/PM/g, function(tok, off){
    var before = f.slice(0, off);
    var afterHour = /h(h?)\s*$/.test(before);
    switch (tok){
      case "yyyy": return String(d.getUTCFullYear());
      case "yy": return String(d.getUTCFullYear()).slice(-2);
      case "mmm": return MONTHS[d.getUTCMonth()];
      case "mm": return afterHour ? two(d.getUTCMinutes()) : two(d.getUTCMonth() + 1);
      case "m": return afterHour ? String(d.getUTCMinutes()) : String(d.getUTCMonth() + 1);
      case "dd": return two(d.getUTCDate());
      case "d": return String(d.getUTCDate());
      case "hh": return two(d.getUTCHours());
      case "h": return String(d.getUTCHours());
      case "ss": return two(d.getUTCSeconds());
      case "AM/PM": return d.getUTCHours() < 12 ? "AM" : "PM";

function fmtNumber(v, fmt){
  if (fmt == null || fmt === "") return null;
  var f = String(fmt);
  if (f === "@") return fmtGeneral(v);
  if (typeof v !== "number" || !isFinite(v)) return null;
  if (/[#0]/.test(f) === false) return null;
  var pct = f.indexOf("%") >= 0;
  var num = pct ? v * 100 : v;
  var fm = /[0#,.]+/.exec(f);
  if (!fm) return null;
  var core = fm[0];
  var prefix = f.slice(0, fm.index), suffix = f.slice(fm.index + core.length);
  var seg = core.split(".");
  var intPat = seg[0], decPat = seg[1] || "";
  var group = intPat.indexOf(",") >= 0;
  var decDigits = decPat.length;
  var neg = num < 0;
  var fixed = Math.abs(num).toFixed(decDigits);
  var parts = fixed.split(".");
  var ip = parts[0];
  var minInt = (intPat.replace(/,/g, "").match(/0/g) || []).length;
  while (ip.length < minInt) ip = "0" + ip;
  if (group) ip = group3(ip);
  var out = ip + (decDigits ? "." + parts[1] : "");

}
function hexCss(h){

function displayOf(cell){
  if (!cell) return "";

  if (cell.t === "d") return formatDate(cell.d != null ? new Date(cell.d) : cell.v, cell.fmt || "yyyy-mm-dd");
  if (cell.t === "n"){
    var f = cell.fmt ? fmtNumber(cell.v, cell.fmt) : null;
    return f == null ? fmtGeneral(cell.v) : f;
  }
  return String(cell.v == null ? "" : cell.v);
}
function rawOf(cell){
  if (!cell) return "";
  if (cell.f) return "=" + cell.f;
  if (cell.t === "d") return formatDate(cell.d != null ? new Date(cell.d) : cell.v, cell.fmt || "yyyy-mm-dd");
  if (cell.t === "b") return cell.v ? "TRUE" : "FALSE";

}
function parseLiteral(raw, o){
  var t = raw.trim();
  if (/^[+-]?(\d+\.?\d*|\.\d+)([eE][+-]?\d+)?$/.test(t)){ o.t = "n"; o.v = parseFloat(t); return; }
  if (/^(true|false)$/i.test(t)){ o.t = "b"; o.v = /^true$/i.test(t); return; }
  var dm = /^(\d{4})-(\d{1,2})-(\d{1,2})([ T](\d{1,2}):(\d{2})(:(\d{2}))?)?$/.exec(t);
  if (dm){
    var dt = new Date(Date.UTC(+dm[1], +dm[2]-1, +dm[3], +(dm[5]||0), +(dm[6]||0), +(dm[8]||0)));
    if (!isNaN(dt.getTime())){
      o.t = "d"; o.d = dt.getTime(); o.v = dateToSerial(dt.getTime());
      if (dm[4]) o.fmt = "yyyy-mm-dd hh:mm";
      return;
    }

var WB = {sheets: [], cur: 0};

function snapshot(){

function sheetSupported(ext){

         ext === "xltx" || ext === "xltm" || ext === "ods" || ext === "csv" ||
         ext === "tsv" || ext === "txt";

function sheetParse(buf){
  var wb = XLSX.read(new Uint8Array(buf), {type: "array", cellFormula: true, cellDates: true});
  wb.SheetNames.forEach(function(nm){
    var ws = wb.Sheets[nm];
    var sh = newSheet(nm);
    var range = ws["!ref"] ? XLSX.utils.decode_range(ws["!ref"]) : null;
    if (range){
      sh.nRows = Math.max(34, range.e.r + 6);
      sh.nCols = Math.max(14, Math.min(80, range.e.c + 4));
      for (var R = range.s.r; R <= range.e.r; R++){
        for (var C = range.s.c; C <= range.e.c; C++){
          var cell = ws[XLSX.utils.encode_cell({r:R, c:C})];
          if (!cell) continue;
          var o = {};
          if (cell.t === "n"){ o.t = "n"; o.v = cell.v; }
          else if (cell.t === "b"){ o.t = "b"; o.v = !!cell.v; }
          else if (cell.t === "d"){
            var ms = (cell.v instanceof Date) ? cell.v.getTime() : +cell.v;
            o.t = "d"; o.d = ms; o.v = dateToSerial(ms);
          }
          else if (cell.t === "e"){ o.t = "e"; o.v = cell.w || "#ERROR!"; }
          else { o.t = "s"; o.v = cell.v == null ? "" : String(cell.v); }
          if (cell.f) o.f = String(cell.f).replace(/^=/, "");
          if (typeof cell.z === "string" && cell.z) o.fmt = cell.z;
          sh.cells[addrOf(R, C)] = o;
        }
      }
    }
    (ws["!merges"] || []).forEach(function(m){
      sh.merges.push({r1: m.s.r, c1: m.s.c, r2: m.e.r, c2: m.e.c});
    });
    (ws["!cols"] || []).forEach(function(cc, i){
      if (cc && cc.wpx) sh.colW[colName(i)] = Math.max(40, Math.round(cc.wpx));
    });
    WB.sheets.push(sh);
  });
  if (!WB.sheets.length) WB.sheets.push(newSheet("Sheet1"));
}

function cellStyleAttr(cell){
  if (!cell || !cell.s) return "";
  var s = cell.s, st = "";
  var dec = (s.u ? "underline" : "") + (s.strike ? (s.u ? " " : "") + "line-through" : "");
  if (s.b) st += "font-weight:bold;";
  if (s.i) st += "font-style:italic;";
  if (dec) st += "text-decoration:" + dec + ";";
  if (s.color) st += "color:" + hexCss(s.color) + ";";
  if (s.bg) st += "background:" + hexCss(s.bg) + ";";
  if (s.sz) st += "font-size:" + (s.sz * 96 / 72).toFixed(1) + "px;";
  if (s.align) st += "text-align:" + s.align + ";";

}
function renderGrid(){

function tdAt(r, c){

function paintSel(){

  for (i = 0; i < colThs.length; i++) colThs[i].classList.remove("lit");
  for (i = 0; i < rowThs.length; i++) rowThs[i].classList.remove("lit");
  paintSel.last = [];
  var r1 = Math.min(sel.r, sel.r2), r2 = Math.max(sel.r, sel.r2);
  var c1 = Math.min(sel.c, sel.c2), c2 = Math.max(sel.c, sel.c2);
  for (var r = r1; r <= r2 && r < tds.length; r++){
    for (var c = c1; c <= c2 && c < tds[r].length; c++){

    }

paintSel.last = [];
function updateSelInfo(){
  var sh = curSheet();

  var r1 = Math.min(sel.r, sel.r2), r2 = Math.max(sel.r, sel.r2);
  var c1 = Math.min(sel.c, sel.c2), c2 = Math.max(sel.c, sel.c2);
  var txt;
  if (r1 === r2 && c1 === c2) txt = addrOf(sel.r, sel.c);
  else txt = addrOf(r1, c1) + ":" + addrOf(r2, c2) + " (" + ((r2-r1+1) * (c2-c1+1)) + ")";
  $("cellRef").textContent = txt;

function moveSel(dr, dc, extend){

  var c = (extend ? sel.c2 : sel.c) + dc;
  r = Math.max(0, Math.min(sh.nRows - 1, r));
  c = Math.max(0, Math.min(sh.nCols - 1, c));
  if (extend){ sel.r2 = r; sel.c2 = c; }
  else { sel.r = r; sel.c = c; sel.r2 = r; sel.c2 = c; }

  scrollCellIntoView(sel.r, sel.c);

function scrollCellIntoView(r, c){

  var wrap = $("gridWrap");
  var t = td.offsetTop, b = t + td.offsetHeight;
  var l = td.offsetLeft, rr = l + td.offsetWidth;
  if (t < wrap.scrollTop + 28) wrap.scrollTop = Math.max(0, t - 30);
  else if (b > wrap.scrollTop + wrap.clientHeight) wrap.scrollTop = b - wrap.clientHeight + 4;
  if (l < wrap.scrollLeft + 42) wrap.scrollLeft = Math.max(0, l - 44);
  else if (rr > wrap.scrollLeft + wrap.clientWidth) wrap.scrollLeft = rr - wrap.clientWidth + 4;
}
function selectAllGrid(){

/* ---------- editing ---------- */
function setCellValue(r, c, raw){
  var sh = curSheet();
  var addr = addrOf(r, c);
  var old = sh.cells[addr];
  raw = String(raw == null ? "" : raw);
  if (raw === "" && !old) return;
  pushUndo();
  if (raw === "") delete sh.cells[addr];
  else {
    var o = {};
    if (raw.charAt(0) === "=") o.f = raw.slice(1);
    else parseLiteral(raw, o);
    if (old && old.s) o.s = old.s;
    if (old && old.fmt && !o.fmt) o.fmt = old.fmt;
    sh.cells[addr] = o;
  }
  ensureSize(sh, r, c);
  recalcAll();
  renderGrid();
  updateSelInfo();
}
function startEdit(r, c, initial){
  if (editing) cancelEdit();
  var td = tdAt(r, c);
  if (!td) return;
  var sh = curSheet();
  td.classList.add("editing");
  var inp = document.createElement("input");
  inp.className = "cellin";
  inp.setAttribute("autocomplete", "off");
  inp.spellcheck = false;
  var cell = sh.cells[addrOf(r, c)];
  inp.value = initial != null ? initial : rawOf(cell);
  td.appendChild(inp);
  editing = {td: td, r: r, c: c, inp: inp};
  inp.focus();
  if (initial == null) inp.select();
  inp.addEventListener("keydown", function(e){
    if (e.key === "Enter"){ e.preventDefault(); commitEdit(); moveSel(1, 0); }
    else if (e.key === "Tab"){ e.preventDefault(); commitEdit(); moveSel(0, e.shiftKey ? -1 : 1); }
    else if (e.key === "Escape"){ e.preventDefault(); cancelEdit(); }
    else if (e.key === "ArrowDown" && e.altKey){ e.preventDefault(); commitEdit(); moveSel(1, 0); }
    else if (e.key === "ArrowUp" && e.altKey){ e.preventDefault(); commitEdit(); moveSel(-1, 0); }
  });
  inp.addEventListener("blur", function(){
    if (editing && editing.inp === inp) commitEdit();
  });
}
function commitEdit(){
  if (!editing) return;
  var ed = editing;
  editing = null;
  var v = ed.inp.value;
  ed.td.classList.remove("editing");
  if (ed.inp.parentNode) ed.inp.parentNode.removeChild(ed.inp);
  setCellValue(ed.r, ed.c, v);
}
function cancelEdit(){
  if (!editing) return;
  var ed = editing;
  editing = null;
  ed.td.classList.remove("editing");
  if (ed.inp.parentNode) ed.inp.parentNode.removeChild(ed.inp);
}

/* ---------- sheet tabs ---------- */
function renderTabs(){
  var el = $("stabs");
  el.innerHTML = "";
  WB.sheets.forEach(function(sh, i){
    var b = document.createElement("button");
    b.type = "button";
    b.className = "stab" + (i === WB.cur ? " on" : "");
    var lbl = document.createElement("span");
    lbl.textContent = sh.name;
    b.appendChild(lbl);
    if (WB.sheets.length > 1){
      var x = document.createElement("span");
      x.className = "x";
      x.textContent = "×";
      x.title = "حذف برگه";
      x.addEventListener("click", function(ev){
        ev.stopPropagation();
        pushUndo();
        WB.sheets.splice(i, 1);
        if (WB.cur >= WB.sheets.length) WB.cur = WB.sheets.length - 1;
        recalcAll(); renderTabs(); renderGrid(); resetSel();
      });
      b.appendChild(x);
    }
    b.addEventListener("click", function(){
      if (WB.cur === i) return;
      WB.cur = i;
      renderTabs(); renderGrid(); resetSel();
    });
    b.addEventListener("dblclick", function(){
      var nm = window.prompt("نام برگه:", sh.name);
      if (!nm || nm === sh.name) return;
      pushUndo();
      sh.name = nm.slice(0, 31);
      renderTabs();
    });
    el.appendChild(b);
  });
  var add = document.createElement("button");
  add.type = "button";
  add.className = "stab-add";
  add.textContent = "+";
  add.title = "برگه جدید";
  add.addEventListener("click", function(){
    pushUndo();
    var n = 1;
    while (WB.sheets.some(function(s){ return s.name === "Sheet" + n; })) n++;

function buildDelimited(sep){
  var sh = curSheet();
  var lines = [];
  for (var r = 0; r < sh.nRows; r++){
    var has = false, cells = [];
    for (var c = 0; c < sh.nCols; c++){
      var cell = sh.cells[addrOf(r, c)];
      var txt = cell ? displayOf(cell) : "";
      if (txt !== "") has = true;
      if (txt.indexOf('"') >= 0 || txt.indexOf(sep) >= 0 ||
          txt.indexOf("\n") >= 0 || txt.indexOf("\r") >= 0){
        txt = '"' + txt.replace(/"/g, '""') + '"';
      }
      cells.push(txt);
    }
    if (has) lines.push(cells.join(sep));
  }
  return lines.join("\r\n");
}
function sheetSave(){
  var ext = EXT;
  if (ext === "csv" || ext === "tsv" || ext === "txt"){
    return saveText(buildDelimited(ext === "tsv" ? "\t" : ","));
  }
  if (ext === "xlsx" || ext === "xltx"){
    setStatus("در حال ساخت فایل...");
    return buildXlsx().then(function(bytes){ return saveToServer(bytes); });
  }
  /* foreign formats (xls/ods/xlsm/...) are rebuilt as a fresh .xlsx download */
  setStatus("در حال ساخت فایل...");
  return buildXlsx().then(function(bytes){
    downloadBytes(bytes, stemOf(NAME) + ".xlsx",
      "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet");
    setStatus("دانلود .xlsx شد (فرمت اصلی .xls/.ods قابل بازنویسی نیست)", "");
    return true;
  });
}

function wireSheetKeys(){
  document.addEventListener("keydown", function(e){
    if (KIND !== "sheet") return;
    if (editing) return;
    var ae = document.activeElement;
    if (ae && (ae.tagName === "INPUT" || ae.tagName === "TEXTAREA" || ae.tagName === "SELECT") &&
        ae !== document.body) return;
    var k = e.key;
    var mod = e.ctrlKey || e.metaKey;
    if (mod && !e.altKey){
      var lk = k.toLowerCase();
      if (lk === "z" && !e.shiftKey){ e.preventDefault(); doUndo(); return; }
      if (lk === "y" || (lk === "z" && e.shiftKey)){ e.preventDefault(); doRedo(); return; }
      if (lk === "a"){ e.preventDefault(); selectAllGrid(); return; }
      if (lk === "b"){ e.preventDefault(); sheetToggle("bold"); return; }
      if (lk === "i"){ e.preventDefault(); sheetToggle("italic"); return; }
      if (lk === "u"){ e.preventDefault(); sheetToggle("underline"); return; }
      if (lk === "s"){ e.preventDefault(); doSheetSave(); return; }
      return;
    }
    switch (k){
      case "ArrowDown": e.preventDefault(); moveSel(1, 0, e.shiftKey); return;
      case "ArrowUp": e.preventDefault(); moveSel(-1, 0, e.shiftKey); return;
      case "ArrowRight": e.preventDefault(); moveSel(0, 1, e.shiftKey); return;
      case "ArrowLeft": e.preventDefault(); moveSel(0, -1, e.shiftKey); return;
      case "Tab": e.preventDefault(); moveSel(0, e.shiftKey ? -1 : 1); return;
      case "Enter": e.preventDefault(); startEdit(sel.r, sel.c); return;
      case "F2": e.preventDefault(); startEdit(sel.r, sel.c); return;
      case "Delete": case "Backspace": e.preventDefault(); setCellValue(sel.r, sel.c, ""); return;
      case "Escape": selectAllGrid(); return;
      case "Home": e.preventDefault(); sel.r = 0; sel.c = 0; sel.r2 = 0; sel.c2 = 0;
                   paintSel(); return;
    }
    if (k.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey){
      e.preventDefault();
      startEdit(sel.r, sel.c, k);
    }
  });
}

var P_NS = "http://schemas.openxmlformats.org/presentationml/2006/main";
var A_NS = "http://schemas.openxmlformats.org/drawingml/2006/main";
var RR_NS = "http://schemas.openxmlformats.org/officeDocument/2006/relationships";

function nsAll(root, ns, name){
  return Array.prototype.slice.call(root.getElementsByTagNameNS(ns, name));

function nsOne(root, ns, name){
  var a = root.getElementsByTagNameNS(ns, name);

function mimeForExt(ext){
  var map = {png: "image/png", jpg: "image/jpeg", jpeg: "image/jpeg", gif: "image/gif",
             bmp: "image/bmp", tif: "image/tiff", tiff: "image/tiff",
             emf: "image/emf", wmf: "image/wmf", svg: "image/svg+xml", webp: "image/webp"};

function resolveZipPath(base, target){
  if (/^[a-z]+:|^\/\//i.test(target)) return target;

  var parts = (dir + target).split("/");
  var out = [];
  for (var i = 0; i < parts.length; i++){
    if (parts[i] === "." || parts[i] === "") { if (i === 0) out.push(""); continue; }
    if (parts[i] === "..") out.pop();
    else out.push(parts[i]);
  }
  return out.join("/");
}
function textFromTxBody(tx){
  var paras = nsAll(tx, A_NS, "p");
  var html = "", firstSz = 0, firstAlign = "";
  paras.forEach(function(p){
    var pPr = nsOne(p, A_NS, "pPr");
    var algn = pPr ? pPr.getAttribute("algn") : "";
    var align = algn === "ctr" ? "center" : algn === "r" ? "right" : algn === "just" ? "justify" : "";
    if (!firstAlign) firstAlign = align;
    var inner = "";
    var kids = p.childNodes;
    for (var i = 0; i < kids.length; i++){
      var k = kids[i];
      if (k.nodeType !== 1) continue;
      if (k.localName === "r" || k.localName === "fld"){
        var rPr = nsOne(k, A_NS, "rPr");
        var tN = nsOne(k, A_NS, "t");
        var txt = tN ? tN.textContent : "";
        var st = "";
        if (rPr){
          if (rPr.getAttribute("b") === "1") st += "font-weight:bold;";
          if (rPr.getAttribute("i") === "1") st += "font-style:italic;";
          var u = rPr.getAttribute("u");
          if (u && u !== "none") st += "text-decoration:underline;";
          var sk = rPr.getAttribute("strike");
          if (sk && sk !== "noStrike") st += "text-decoration:line-through;";
          var sz = rPr.getAttribute("sz");
          if (sz && !firstSz) firstSz = parseInt(sz, 10) / 100;
          var fill = nsOne(rPr, A_NS, "solidFill");
          if (fill){
            var clr = nsOne(fill, A_NS, "srgbClr");
            if (clr) st += "color:#" + clr.getAttribute("val") + ";";
          }
          var lat = nsOne(rPr, A_NS, "latin");
          if (lat && lat.getAttribute("typeface")) st += "font-family:" + lat.getAttribute("typeface") + ";";
        }
        inner += st ? '<span style="' + st + '">' + esc(txt) + "</span>" : esc(txt);
      } else if (k.localName === "br"){
        inner += "<br>";
      }
    }
    html += "<p" + (align ? ' style="text-align:' + align + '"' : "") + ">" +
            (inner || "<br>") + "</p>";
  });
  return {html: html || "<p><br></p>", sz: firstSz, align: firstAlign};
}
function xfrmOf(el){
  var spPr = nsOne(el, P_NS, "spPr");
  if (!spPr) spPr = nsOne(el, A_NS, "spPr");
  var xfrm = spPr ? nsOne(spPr, A_NS, "xfrm") : null;
  if (!xfrm) return null;
  var off = nsOne(xfrm, A_NS, "off"), ext = nsOne(xfrm, A_NS, "ext");
  if (!off || !ext) return null;
  return {x: +off.getAttribute("x") || 0, y: +off.getAttribute("y") || 0,
          cx: +ext.getAttribute("cx") || 0, cy: +ext.getAttribute("cy") || 0};
}
function emuXp(v){ return v / sldCx * 100; }
function emuYp(v){ return v / sldCy * 100; }
function ptToEm(pt){ return (pt * 1270000) / sldCx; }

function emptySlide(){

    {x: 10, y: 36, w: 80, h: 22, size: 5, align: "center",

function parseSlideXml(xmlStr, relsMap, zip){
  var doc = new DOMParser().parseFromString(xmlStr, "application/xml");
  var slide = {bg: "", blocks: [], images: []};
  var bg = nsOne(doc.documentElement, P_NS, "bg");
  if (bg){
    var bgClr = nsOne(bg, A_NS, "srgbClr");
    if (bgClr) slide.bg = "#" + bgClr.getAttribute("val");

  var spTree = nsOne(doc.documentElement, P_NS, "spTree");

  for (var i = 0; i < kids.length; i++){

      if (k.localName === "sp"){
        var tx = nsOne(k, P_NS, "txBody");
        if (!tx) return;
        var plain = "";
        nsAll(tx, A_NS, "t").forEach(function(t){ plain += t.textContent; });
        if (!plain.trim()) return;
        var t2 = textFromTxBody(tx);
        var xf = xfrmOf(k);
        slide.blocks.push({
          x: xf ? emuXp(xf.x) : 8,
          y: xf ? emuYp(xf.y) : 8,
          w: xf ? emuXp(xf.cx) : 60,
          h: xf ? emuYp(xf.cy) : 14,
          size: t2.sz ? ptToEm(t2.sz) : 3,
          align: t2.align || "",
          html: t2.html

      } else if (k.localName === "pic"){
        var blip = nsOne(k, A_NS, "blip");
        var rid = blip ? relAttr(blip, "embed") : null;
        var target = rid ? relsMap[rid] : null;
        if (!target || /^https?:/i.test(target)) return;
        var path = resolveZipPath("ppt/slides/x.xml", target);
        var m = /\.([a-z0-9]+)$/i.exec(path);
        var ext = m ? m[1].toLowerCase() : "png";
        var f = zip.file(path);
        if (!f) return;
        jobs.push(f.async("uint8array").then(function(bytes){
          var url = URL.createObjectURL(new Blob([bytes], {type: mimeForExt(ext)}));
          var xf2 = xfrmOf(k);
          slide.images.push({
            url: url, path: path, ext: ext,
            x: xf2 ? emuXp(xf2.x) : 10, y: xf2 ? emuYp(xf2.y) : 10,
            w: xf2 ? emuXp(xf2.cx) : 40, h: xf2 ? emuYp(xf2.cy) : 40
          });
        }));
      }
    })(kids[i]);
  }

function slideParse(buf){
  return JSZip.loadAsync(buf).then(function(zip){
    var pres = zip.file("ppt/presentation.xml");
    var prel = zip.file("ppt/_rels/presentation.xml.rels");
    if (!pres || !prel) throw new Error("presentation.xml یافت نشد");
    return Promise.all([pres.async("string"), prel.async("string")]).then(function(res){
      var presDoc = new DOMParser().parseFromString(res[0], "application/xml");
      var relsDoc = new DOMParser().parseFromString(res[1], "application/xml");
      var relMap = {};
      nsAll(relsDoc, "*", "Relationship").forEach(function(r){
        relMap[r.getAttribute("Id")] = r.getAttribute("Target");
      });
      var sldSz = nsOne(presDoc.documentElement, P_NS, "sldSz");
      if (sldSz){
        sldCx = +sldSz.getAttribute("cx") || sldCx;
        sldCy = +sldSz.getAttribute("cy") || sldCy;
      }
      var lst = nsOne(presDoc.documentElement, P_NS, "sldIdLst");
      var parts = [];
      if (lst){
        nsAll(lst, P_NS, "sldId").forEach(function(sid){
          var rid = relAttr(sid, "id");
          var tgt = rid ? relMap[rid] : null;
          if (tgt) parts.push(resolveZipPath("ppt/presentation.xml", tgt));
        });
      }
      if (!parts.length) throw new Error("اسلایدی در فایل نیست");
      var chain = Promise.resolve([]);
      parts.forEach(function(part){
        chain = chain.then(function(acc){
          var f = zip.file(part);
          if (!f) return acc;
          var relsPart = part.replace(/\/([^/]+)$/, "/_rels/$1.rels");
          var rf = zip.file(relsPart);
          var rp = rf ? rf.async("string").then(function(s){
            var d = new DOMParser().parseFromString(s, "application/xml");
            var map = {};
            nsAll(d, "*", "Relationship").forEach(function(r){
              map[r.getAttribute("Id")] = r.getAttribute("Target");
            });
            return map;
          }) : Promise.resolve({});
          return Promise.all([f.async("string"), rp]).then(function(r2){
            return parseSlideXml(r2[0], r2[1], zip).then(function(sl){
              acc.push(sl);
              return acc;
            });
          });
        });
      });
      return chain;
    });
  }).then(function(slides){
    SLIDES = slides;
    slideIdx = 0;
  });
}

function newSlideXml(){

    "</p:spTree></p:cSld>" +

function mkEl(doc, ns, qname, attrs){

function appendXfrm(doc, owner, x, y, w, h){

  var ext = mkEl(doc, A_NS, "a:ext", {cx: Math.round(Math.max(1, w)), cy: Math.round(Math.max(1, h))});

  xfrm.appendChild(ext);

function makeSpXml(doc, b, id){
  var sp = mkEl(doc, P_NS, "p:sp");
  var nv = mkEl(doc, P_NS, "p:nvSpPr");
  nv.appendChild(mkEl(doc, P_NS, "p:cNvPr", {id: String(id), name: "Text Box " + id}));
  nv.appendChild(mkEl(doc, P_NS, "p:cNvSpPr", {txBox: "1"}));
  nv.appendChild(mkEl(doc, P_NS, "p:nvPr"));
  sp.appendChild(nv);
  var spPr = mkEl(doc, P_NS, "p:spPr");
  appendXfrm(doc, spPr,
    b.x / 100 * sldCx, b.y / 100 * sldCy,
    (b.w || 40) / 100 * sldCx, (b.h || 12) / 100 * sldCy);
  sp.appendChild(spPr);
  var tx = mkEl(doc, P_NS, "p:txBody");
  tx.appendChild(mkEl(doc, A_NS, "a:bodyPr", {wrap: "square", rtlCol: "0", anchor: "t"}));
  tx.appendChild(mkEl(doc, A_NS, "a:lstStyle"));
  var tmp = document.createElement("div");
  tmp.innerHTML = b.html || "";
  var paras = blocksOf(tmp);
  var defaultPt = b.size ? b.size * sldCx / 1270000 : 18;
  paras.forEach(function(pb){
    var p = mkEl(doc, A_NS, "a:p");
    var aa = pb.align || b.align || "";
    if (aa){
      p.appendChild(mkEl(doc, A_NS, "a:pPr",
        {algn: aa === "center" ? "ctr" : aa === "right" ? "r" : aa === "justify" ? "just" : "l"}));
    }
    pb.runs.forEach(function(r){
      if (r.br){ p.appendChild(mkEl(doc, A_NS, "a:br")); return; }
      if (r.img) return;
      var run = mkEl(doc, A_NS, "a:r");
      var rPr = mkEl(doc, A_NS, "a:rPr", {lang: "fa-IR", dirty: "0"});
      var sz = Math.round((r.sz || defaultPt) * 100);
      if (sz > 0) rPr.setAttribute("sz", String(sz));
      if (r.b) rPr.setAttribute("b", "1");
      if (r.i) rPr.setAttribute("i", "1");
      if (r.u) rPr.setAttribute("u", "sng");
      if (r.strike) rPr.setAttribute("strike", "sngStrike");
      if (r.color){
        var fill = mkEl(doc, A_NS, "a:solidFill");
        fill.appendChild(mkEl(doc, A_NS, "a:srgbClr", {val: String(r.color).replace("#", "")}));
        rPr.appendChild(fill);
      }
      if (r.hl){
        var hl = mkEl(doc, A_NS, "a:highlight");
        hl.appendChild(mkEl(doc, A_NS, "a:srgbClr", {val: String(r.hl).replace("#", "")}));
        rPr.appendChild(hl);

      if (r.font) rPr.appendChild(mkEl(doc, A_NS, "a:latin", {typeface: r.font}));
      run.appendChild(rPr);
      var t = mkEl(doc, A_NS, "a:t");

}
function makePicXml(doc, im, rid, id){
  var pic = mkEl(doc, P_NS, "p:pic");
  var nv = mkEl(doc, P_NS, "p:nvPicPr");
  nv.appendChild(mkEl(doc, P_NS, "p:cNvPr", {id: String(id), name: "Picture " + id}));
  nv.appendChild(mkEl(doc, P_NS, "p:cNvPicPr"));

function writeSlideXml(origXml, slide, addMedia){
  var doc = origXml ? parseXmlStr(origXml) : null;
  if (!doc || !doc.documentElement || doc.documentElement.localName !== "sld"){
    doc = parseXmlStr(newSlideXml());
  }
  var root = doc.documentElement;
  var cSld = nsOne(root, P_NS, "cSld");
  var oldBg = nsOne(cSld, P_NS, "bg");
  if (oldBg) cSld.removeChild(oldBg);
  if (slide.bg){
    var bgFrag = parseXmlStr('<r xmlns:p="' + P_NS + '" xmlns:a="' + A_NS + '">' +
      '<p:bg><p:bgPr><a:solidFill><a:srgbClr val="' +
      String(slide.bg).replace("#", "").toUpperCase() +
      '"/></a:solidFill><a:effectLst/></p:bgPr></p:bg></r>');
    cSld.insertBefore(bgFrag.firstChild, cSld.firstChild);
  }
  var spTree = nsOne(cSld, P_NS, "spTree");
  var stale = [];
  for (var i = 0; i < spTree.children.length; i++){
    var k = spTree.children[i];
    if (k.localName !== "nvGrpSpPr" && k.localName !== "grpSpPr") stale.push(k);
  }
  stale.forEach(function(k){ spTree.removeChild(k); });

  slide.blocks.forEach(function(b){ spTree.appendChild(makeSpXml(doc, b, id++)); });
  var jobs = slide.images.map(function(im){
    return addMedia(im).then(function(rid){
      spTree.appendChild(makePicXml(doc, im, rid, id++));
    });
  });

}
function nextRIdFrom(doc){
  var mx = 0;
  nsAll(doc.documentElement, "*", "Relationship").forEach(function(r){
    var m = /^rId(\d+)$/.exec(r.getAttribute("Id") || "");
    if (m) mx = Math.max(mx, +m[1]);
  });
  return "rId" + (mx + 1);
}
function makeMediaAdder(zip, relsState, usedExts){
  return function(im){
    return fetch(im.url).then(function(r){ return r.arrayBuffer(); }).then(function(buf){
      var ext = (im.ext || "png").toLowerCase();
      var base = "img_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2, 7) + "." + ext;
      var path = "ppt/media/" + base;
      var n = 2;
      while (zip.file(path)){
        path = "ppt/media/" + base.replace(/(\.[a-z0-9]+)$/, "_" + n + "$1");
        n++;
      }
      zip.file(path, new Uint8Array(buf));
      usedExts[ext] = true;
      var rid = nextRIdFrom(relsState.doc);
      var rel = mkEl(relsState.doc, PKG_NS, "Relationship", {
        Id: rid,
        Type: "http://schemas.openxmlformats.org/officeDocument/2006/relationships/image",
        Target: "../media/" + path.replace("ppt/media/", "")
      });
      relsState.doc.documentElement.appendChild(rel);
      return rid;
    });
  };
}
function loadSlideRels(zip, part, layoutHint){
  var path = part ? part.replace(/\/([^/]+)$/, "/_rels/$1.rels") : null;
  if (path && zip.file(path)){
    return zip.file(path).async("string").then(function(s){
      var doc = parseXmlStr(s);
      if (!doc) throw new Error("rels خراب است: " + path);
      return {doc: doc, path: path};
    });
  }
  var doc = parseXmlStr('<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<Relationships xmlns="' + PKG_NS + '"/>');
  var rel = mkEl(doc, PKG_NS, "Relationship", {
    Id: "rId1",
    Type: "http://schemas.openxmlformats.org/officeDocument/2006/relationships/slideLayout",
    Target: layoutHint || "../slideLayouts/slideLayout1.xml"
  });
  doc.documentElement.appendChild(rel);
  var out = {doc: doc, path: path};
  if (!part) out.newPartPath = true;
  return Promise.resolve(out);
}
function buildPptx(zip){
  var presPath = "ppt/presentation.xml";
  var relsPath = "ppt/_rels/presentation.xml.rels";
  var ctPath = "[Content_Types].xml";
  if (!zip.file(presPath) || !zip.file(relsPath)) throw new Error("ساختار pptx نامعتبر است");
  return Promise.all([
    zip.file(presPath).async("string"),
    zip.file(relsPath).async("string"),
    zip.file(ctPath).async("string")
  ]).then(function(res){
    var presDoc = parseXmlStr(res[0]);
    var relsDoc = parseXmlStr(res[1]);
    var ctDoc = parseXmlStr(res[2]);
    if (!presDoc || !relsDoc || !ctDoc) throw new Error("XML فایل قابل خواندن نیست");
    var relList = nsAll(relsDoc.documentElement, "*", "Relationship");
    var ridToPart = {};
    relList.forEach(function(r){
      if (!/\/slide$/.test(r.getAttribute("Type") || "")) return;
      ridToPart[r.getAttribute("Id")] = resolveZipPath(presPath, r.getAttribute("Target"));
    });
    var lst = nsOne(presDoc.documentElement, P_NS, "sldIdLst");
    var sldIdByRid = {};
    var ordered = [];
    if (lst){
      nsAll(lst, P_NS, "sldId").forEach(function(sid){
        var rid = relAttr(sid, "id");
        if (!rid) return;
        sldIdByRid[rid] = sid;
        if (ridToPart[rid]) ordered.push({rid: rid, part: ridToPart[rid]});
      });
    }
    var plan = SLIDES.map(function(sl, i){
      var ref = i < ordered.length ? ordered[i] : null;
      return {sl: sl, ref: ref, part: ref ? ref.part : null, newRid: null};
    });
    var maxSlideN = 0, ridMax = 0, sldIdMax = 255;
    Object.keys(zip.files).forEach(function(nm){
      var m = /^ppt\/slides\/slide(\d+)\.xml$/.exec(nm);
      if (m) maxSlideN = Math.max(maxSlideN, +m[1]);
    });
    relList.forEach(function(r){
      var m = /^rId(\d+)$/.exec(r.getAttribute("Id") || "");
      if (m) ridMax = Math.max(ridMax, +m[1]);
    });
    nsAll(presDoc.documentElement, P_NS, "sldId").forEach(function(s){
      sldIdMax = Math.max(sldIdMax, +s.getAttribute("id") || 0);
    });
    var layoutHint = null;
    var layoutFile = Object.keys(zip.files).filter(function(nm){
      return /^ppt\/slideLayouts\/slideLayout\d+\.xml$/.test(nm);
    })[0];
    if (layoutFile) layoutHint = "../" + layoutFile.replace("ppt/", "");
    var usedExts = {};
    var chain = Promise.resolve();
    plan.forEach(function(p){
      chain = chain.then(function(){
        return loadSlideRels(zip, p.part, layoutHint).then(function(relsState){
          if (!p.part){
            maxSlideN++;
            p.part = "ppt/slides/slide" + maxSlideN + ".xml";
            ridMax++;
            p.newRid = "rId" + ridMax;
            if (!relsState.path) relsState.path = "ppt/slides/_rels/slide" + maxSlideN + ".xml.rels";
          }
          var addMedia = makeMediaAdder(zip, relsState, usedExts);
          var origP = zip.file(p.part) ? zip.file(p.part).async("string") : Promise.resolve(null);
          return origP.then(function(origXml){
            return writeSlideXml(origXml, p.sl, addMedia).then(function(xml){
              zip.file(p.part, xml);
              zip.file(relsState.path, serializeDoc(relsState.doc));
            });
          });
        });
      });
    });
    return chain.then(function(){
      /* presentation: rebuild sldIdLst in model order */
      if (!lst){
        lst = mkEl(presDoc, P_NS, "p:sldIdLst");
        var anchor = nsOne(presDoc.documentElement, P_NS, "clrMapOvr");
        if (anchor) presDoc.documentElement.insertBefore(lst, anchor);
        else presDoc.documentElement.appendChild(lst);
      }
      while (lst.firstChild) lst.removeChild(lst.firstChild);
      plan.forEach(function(p){
        var el = p.ref ? sldIdByRid[p.ref.rid] : null;
        if (!el){
          el = mkEl(presDoc, P_NS, "p:sldId");
          sldIdMax++;
          el.setAttribute("id", String(Math.max(256, sldIdMax)));
          el.setAttributeNS(RR_NS, "r:id", p.newRid);
        }
        lst.appendChild(el);
      });
      /* presentation rels: drop removed slides, register new ones */
      var finalRids = {};
      plan.forEach(function(p){ finalRids[p.ref ? p.ref.rid : p.newRid] = true; });
      relList.forEach(function(r){
        if (!/\/slide$/.test(r.getAttribute("Type") || "")) return;
        if (!finalRids[r.getAttribute("Id")]) r.parentNode.removeChild(r);
      });
      plan.forEach(function(p){
        if (p.ref) return;
        relsDoc.documentElement.appendChild(mkEl(relsDoc, PKG_NS, "Relationship", {
          Id: p.newRid,
          Type: "http://schemas.openxmlformats.org/officeDocument/2006/relationships/slide",
          Target: "slides/" + p.part.replace("ppt/slides/", "")
        }));
      });
      /* zip: remove parts of deleted slides */
      var finalParts = {};
      plan.forEach(function(p){ finalParts[p.part] = true; });
      Object.keys(zip.files).forEach(function(nm){
        var m = /^ppt\/slides\/(slide\d+\.xml)$/.exec(nm);
        if (m && !finalParts["ppt/slides/" + m[1]]) zip.remove(nm);
        var mr = /^ppt\/slides\/_rels\/(slide\d+\.xml)\.rels$/.exec(nm);
        if (mr && !finalParts["ppt/slides/" + mr[1]]) zip.remove(nm);
      });
      /* content types */
      nsAll(ctDoc.documentElement, "*", "Override").forEach(function(o){
        var m = /^\/(ppt\/slides\/slide\d+\.xml)$/.exec(o.getAttribute("PartName") || "");
        if (m && !finalParts[m[1]]) o.parentNode.removeChild(o);
      });
      plan.forEach(function(p){
        if (p.ref) return;
        ctDoc.documentElement.appendChild(mkEl(ctDoc, CT_NS, "Override", {
          PartName: "/" + p.part,
          ContentType: "application/vnd.openxmlformats-officedocument.presentationml.slide+xml"
        }));
      });
      var haveDefault = {};
      nsAll(ctDoc.documentElement, "*", "Default").forEach(function(d){
        haveDefault[String(d.getAttribute("Extension") || "").toLowerCase()] = true;
      });
      Object.keys(usedExts).forEach(function(ext){
        if (haveDefault[ext]) return;
        ctDoc.documentElement.appendChild(mkEl(ctDoc, CT_NS, "Default", {
          Extension: ext, ContentType: mimeForExt(ext)
        }));
      });
      zip.file(presPath, serializeDoc(presDoc));
      zip.file(relsPath, serializeDoc(relsDoc));
      zip.file(ctPath, serializeDoc(ctDoc));
      return zip.generateAsync({
        type: "uint8array",
        mimeType: "application/vnd.openxmlformats-officedocument.presentationml.presentation",
        compression: "DEFLATE",
        compressionOptions: {level: 6}
      });
    });
  });
}
function slideSave(){
  if (EXT !== "pptx") return Promise.resolve(false);

    return JSZip.loadAsync(buf);
  }).then(function(zip){
    return buildPptx(zip);
  }).then(function(bytes){

}
/* ---------- present mode ---------- */
function renderPresent(){
  var sl = SLIDES[presentIdx];
  var inner = $("pinner");
  var host = $("pslide").getBoundingClientRect();
  var ratio = sldCx / (sldCy || 1);
  var w = host.width, h = w / ratio;
  if (h > host.height){ h = host.height; w = h * ratio; }
  inner.style.width = Math.max(80, w) + "px";
  inner.style.height = Math.max(45, h) + "px";
  inner.style.background = (sl && sl.bg) || "#ffffff";
  inner.style.fontSize = (Math.max(80, w) / 100) + "px";
  inner.innerHTML = "";
  if (!sl) return;
  sl.blocks.forEach(function(b){
    var el = blockEl(b, null);
    el.contentEditable = "false";
    inner.appendChild(el);
  });
  sl.images.forEach(function(im){
    var img = document.createElement("img");
    img.className = "simg";
    img.src = im.url;
    img.style.left = im.x + "%";
    img.style.top = im.y + "%";
    img.style.width = im.w + "%";
    img.style.height = im.h + "%";
    inner.appendChild(img);
  });
  $("pcount").textContent = (presentIdx + 1) + " / " + SLIDES.length;
}
function startPresent(){

function exitPresent(){ $("present").hidden = true; }
function presentNav(d){
  var n = presentIdx + d;
  if (n < 0 || n >= SLIDES.length) return;
  presentIdx = n;
  renderPresent();
}
function syncSlideToolbar(){
  var b = activeBlk;
  if (!b || !b.isConnected || !$("scanvas").contains(b)) return;
  try {
    var cs = window.getComputedStyle(b);
    var fam = String(cs.fontFamily || "").split(",")[0].replace(/["']/g, "").trim();
    if (fam && FONTS.indexOf(fam) >= 0) $("ffSel").value = fam;
    var px = Math.round((parseFloat(cs.fontSize) || 16) * 0.75);
    if (SIZES.indexOf(px) >= 0) $("fsSel").value = String(px);
  } catch(e){}
}
function wireSlideToolbar(){
  $("sAdd").addEventListener("click", slideAdd);
  $("sDup").addEventListener("click", slideDup);
  $("sDel").addEventListener("click", slideDel);
  $("sPrev").addEventListener("click", function(){ gotoSlide(slideIdx - 1); });
  $("sNext").addEventListener("click", function(){ gotoSlide(slideIdx + 1); });
  $("sBg").addEventListener("input", function(){
    var sl = SLIDES[slideIdx];
    if (!sl) return;
    sl.bg = this.value;
    $("scanvas").style.background = this.value;
    renderThumbs();
    markSlideDirty();
  });
  $("sText").addEventListener("click", slideAddText);
  $("sPresent").addEventListener("click", startPresent);
  $("ffSel").addEventListener("change", function(){
    if (!activeBlk || !$("scanvas").contains(activeBlk)) return;
    activeBlk.style.fontFamily = this.value;
    markSlideDirty(); syncSlideFromDom(); renderThumbs();
  });
  $("fsSel").addEventListener("change", function(){
    if (!activeBlk || !$("scanvas").contains(activeBlk)) return;
    var pt = parseInt(this.value, 10);
    if (pt) activeBlk.style.fontSize = ptToEm(pt) + "em";
    markSlideDirty(); syncSlideFromDom(); renderThumbs();
  });
  $("pPrev").addEventListener("click", function(e){ e.stopPropagation(); presentNav(-1); });
  $("pNext").addEventListener("click", function(e){ e.stopPropagation(); presentNav(1); });
  $("pExit").addEventListener("click", function(e){ e.stopPropagation(); exitPresent(); });
  $("pslide").addEventListener("click", function(){ presentNav(1); });
}
function wireSlideKeys(){
  document.addEventListener("keydown", function(e){
    if (KIND !== "slide") return;
    if (!$("present").hidden){
      if (e.key === "Escape"){ e.preventDefault(); exitPresent(); }
      else if (e.key === "ArrowRight" || e.key === " " || e.key === "PageDown" || e.key === "Enter"){
        e.preventDefault(); presentNav(1);
      }
      else if (e.key === "ArrowLeft" || e.key === "PageUp"){ e.preventDefault(); presentNav(-1); }
      return;
    }
    var mod = e.ctrlKey || e.metaKey;
    if (mod && !e.altKey){
      var lk = e.key.toLowerCase();
      if (lk === "z" && !e.shiftKey){ e.preventDefault(); doUndo(); return; }
      if (lk === "y" || (lk === "z" && e.shiftKey)){ e.preventDefault(); doRedo(); return; }
      if (lk === "s"){ e.preventDefault(); doSave(); return; }
      return;
    }
    var ae = document.activeElement;
    if (ae && ae.classList && ae.classList.contains("sblk")) return;
    if (e.key === "ArrowRight" || e.key === "PageDown"){ e.preventDefault(); gotoSlide(slideIdx + 1); }
    else if (e.key === "ArrowLeft" || e.key === "PageUp"){ e.preventDefault(); gotoSlide(slideIdx - 1); }
  });
}
function wireSlideDrag(){
  var canvas = $("scanvas");
  canvas.addEventListener("mousedown", function(e){
    if (e.button !== 0) return;
    var t = e.target;
    if (!t || !t.closest) return;
    if (t.closest("img.simg")){ e.preventDefault(); return; }
    var el = t.closest(".sblk");
    if (!el) return;
    var sl = SLIDES[slideIdx];
    var b = sl && sl.blocks[+el._bi];
    if (!b) return;
    dragBlk = {el: el, b: b, x0: e.clientX, y0: e.clientY, ox: b.x, oy: b.y,
               moved: false, snap: snapshot()};
    e.preventDefault();
  });
  document.addEventListener("mousemove", function(e){
    if (!dragBlk) return;
    var dx = e.clientX - dragBlk.x0, dy = e.clientY - dragBlk.y0;
    if (!dragBlk.moved){
      if (Math.abs(dx) + Math.abs(dy) < 5) return;
      dragBlk.moved = true;
      undoStack.push(dragBlk.snap);
      if (undoStack.length > 60) undoStack.shift();
      redoStack.length = 0;
      try { dragBlk.el.blur(); } catch(err){}
      markSlideDirty();
    }
    var rect = $("scanvas").getBoundingClientRect();
    var b = dragBlk.b;
    b.x = Math.max(-10, Math.min(97, dragBlk.ox + dx * 100 / rect.width));
    b.y = Math.max(-10, Math.min(97, dragBlk.oy + dy * 100 / rect.height));
    dragBlk.el.style.left = b.x + "%";
    dragBlk.el.style.top = b.y + "%";
  });
  document.addEventListener("mouseup", function(e){
    if (!dragBlk) return;
    var d = dragBlk;
    dragBlk = null;
    if (d.moved){ renderThumbs(); return; }
    d.el.focus();
    activeBlk = d.el;
    var rg = null;
    if (document.caretRangeFromPoint){
      rg = document.caretRangeFromPoint(e.clientX, e.clientY);
    } else if (document.caretPositionFromPoint){
      var cp = document.caretPositionFromPoint(e.clientX, e.clientY);
      if (cp){
        rg = document.createRange();
        rg.setStart(cp.offsetNode, Math.min(cp.offset, (cp.offsetNode.textContent || "").length));
      }
    }
    if (rg){
      rg.collapse(true);
      var s = window.getSelection();
      s.removeAllRanges();
      s.addRange(rg);
    }
  });
}
function slideBoot(){
  document.body.className = "k-slide";
  $("footKind").textContent = "ارائه";
  $("footHint").textContent = "کلیک برای ویرایش · بکشید تا جابه‌جا شود · دکمه نمایش برای اجرا";
  wireSlideToolbar();
  wireSlideKeys();
  wireSlideDrag();
  $("scanvas").addEventListener("input", markSlideDirty);
  $("scanvas").addEventListener("focusin", function(e){
    var t = e.target;
    if (t && t.classList && t.classList.contains("sblk")) activeBlk = t;
  });
  if (EXT !== "pptx"){
    showNotice("این فرمت در مرورگر ویرایش نمی‌شود",
      "فرمت ." + EXT + " را فقط PowerPoint باز می‌کند. فایل را دانلود کنید.");
    $("saveBtn").style.display = "none";
    $("footInfo").textContent = "فرمت پشتیبانی‌نشده";
    return Promise.resolve();
  }
  return loadScript("/static/vendor/jszip.min.js").then(function(){
    return fetchBytes();
  }).then(function(buf){
    setStatus("در حال باز کردن...");
    return slideParse(buf);
  }).then(function(){
    renderThumbs();
    renderSlide();
    setStatus("");
    $("footInfo").textContent = SLIDES.length + " اسلاید";
  }).catch(function(err){
    showNotice("خطا در باز کردن فایل", String((err && err.message) || err));
  });
}

/* ---------- shared toolbar / header / boot ---------- */
var JUSTIFY = {left: "justifyLeft", center: "justifyCenter",
               right: "justifyRight", justify: "justifyFull"};
function wireToolbarCommon(){
  Array.prototype.forEach.call(document.querySelectorAll(".tb[data-cmd]"), function(b){
    var cmd = b.getAttribute("data-cmd");
    if (cmd === "undo" || cmd === "redo") return;
    b.addEventListener("mousedown", function(e){
      if (KIND !== "word") return;
      var t = e.target;
      if (t && t.closest && t.closest("input,label")) return;
      e.preventDefault();
      saveSel();
    });
    b.addEventListener("click", function(){
      if (KIND === "word"){
        restoreSel();
        exec(cmd);
        syncToolbar();
      } else if (KIND === "sheet" &&
                 (cmd === "bold" || cmd === "italic" || cmd === "underline" || cmd === "strike")){
        sheetToggle(cmd);
        syncSheetToolbar();
      }
    });
  });
  var undoB = document.querySelector('.tb[data-cmd="undo"]');
  var redoB = document.querySelector('.tb[data-cmd="redo"]');
  if (undoB) undoB.addEventListener("mousedown", function(e){ if (KIND === "word"){ e.preventDefault(); saveSel(); } });
  if (redoB) redoB.addEventListener("mousedown", function(e){ if (KIND === "word"){ e.preventDefault(); saveSel(); } });
  if (undoB) undoB.addEventListener("click", function(){
    if (KIND === "word"){ restoreSel(); exec("undo"); }
    else doUndo();
  });
  if (redoB) redoB.addEventListener("click", function(){
    if (KIND === "word"){ restoreSel(); exec("redo"); }
    else doRedo();
  });
  Array.prototype.forEach.call(document.querySelectorAll(".tb[data-align]"), function(b){
    var al = b.getAttribute("data-align");
    b.addEventListener("mousedown", function(e){
      if (KIND !== "word") return;
      var t = e.target;
      if (t && t.closest && t.closest("input,label")) return;
      e.preventDefault();
      saveSel();
    });
    b.addEventListener("click", function(){
      if (KIND === "word"){
        restoreSel();
        exec(JUSTIFY[al] || "justifyLeft");
        syncToolbar();
      } else if (KIND === "sheet"){
        sheetCellStyle("align", al);
        syncSheetToolbar();
      } else if (KIND === "slide"){
        if (activeBlk && $("scanvas").contains(activeBlk)){
          activeBlk.style.textAlign = al;
          markSlideDirty();
          syncSlideFromDom();
          renderThumbs();
        }
      }
    });
  });
  var fg = $("fgCol"), bg = $("bgCol");
  fg.addEventListener("mousedown", function(){ if (KIND === "word") saveSel(); });
  bg.addEventListener("mousedown", function(){ if (KIND === "word") saveSel(); });
  fg.addEventListener("input", function(){
    if (KIND === "word"){ restoreSel(); execCss("foreColor", this.value); }
    else if (KIND === "slide"){
      if (activeBlk && $("scanvas").contains(activeBlk)){
        activeBlk.focus();
        execCss("foreColor", this.value);
        syncSlideFromDom();
        renderThumbs();
      }
    }
  });
  bg.addEventListener("input", function(){
    if (KIND === "word"){ restoreSel(); execCss("backColor", this.value); }
    else if (KIND === "slide"){
      if (activeBlk && $("scanvas").contains(activeBlk)){
        activeBlk.focus();
        try { document.execCommand("styleWithCSS", false, "true"); } catch(e){}
        try { document.execCommand("hiliteColor", false, this.value); }
        catch(e){
          try { document.execCommand("backColor", false, this.value); } catch(e2){}
        }
        syncSlideFromDom();
        renderThumbs();
      }
    }
  });
  fg.addEventListener("change", function(){
    if (KIND === "sheet") sheetCellStyle("foreColor", this.value);
  });
  bg.addEventListener("change", function(){
    if (KIND === "sheet") sheetCellStyle("backColor", this.value);
  });
}
function doSave(){
  if (KIND === "word") return wordSave();
  if (KIND === "sheet") return sheetSave();
  if (KIND === "slide") return slideSave();
  return Promise.resolve(false);
}
function doSheetSave(){ return doSave(); }
function wireHeader(){
  $("backBtn").addEventListener("click", closeViewerTab);
  $("noticeBack").addEventListener("click", closeViewerTab);
  $("saveBtn").addEventListener("click", function(){
    var b = this;
    if (b.disabled) return;
    b.disabled = true;
    Promise.resolve(doSave()).then(function(){ b.disabled = false; },
      function(){ b.disabled = false; setStatus("خطا در ذخیره", "err"); });
  });
}
function boot(){
  wireToolbarCommon();
  wireHeader();
  var p;
  if (KIND === "word") p = wordBoot();
  else if (KIND === "sheet") p = sheetBoot();
  else if (KIND === "slide") p = slideBoot();
  else {
    showNotice("نوع فایل پشتیبانی نمی‌شود", "این صفحه فقط برای فایل‌های Word/Excel/PowerPoint است.");
    $("saveBtn").style.display = "none";
    p = Promise.resolve();
  }
  Promise.resolve(p).then(function(){ syncToolbar(); });
}
boot();
